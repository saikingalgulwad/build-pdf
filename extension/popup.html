<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>Save Conversation</title>
    <style>
      body { font-family: Arial, sans-serif; width: 320px; background:#0d1328; color: white; padding: 12px; }
      input, select, textarea, button { width: 100%; margin-top: 8px; padding: 8px; border-radius: 6px; border: 1px solid #26355d; background: #121a33; color: white; }
      button { background: #6aa9ff; color: #041126; border: none; font-weight: 600; }
      small { color: #a7b4d6; }
    </style>
  </head>
  <body>
    <h3>Save to Chapter</h3>
    <small id="status">Checking login...</small>
    <select id="chapter"></select>
    <input id="title" placeholder="Title" />
    <textarea id="notes" placeholder="Notes (optional)"></textarea>
    <button id="saveBtn">Save</button>

    <script src="popup.js"></script>
  </body>
</html>
